<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <linearGradient id="cubeLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <style>
      .stock-text { fill: #FFFFFF; }
      .sense-text { fill: #818CF8; }
      .badge-bg { fill: #23232C; stroke: #353748; }
      .badge-text { fill: #9CA3AF; }
      @media (prefers-color-scheme: light) {
        .stock-text { fill: #141312; }
        .sense-text { fill: #4F46E5; }
        .badge-bg { fill: #E2DDD3; stroke: #C8C2B5; }
        .badge-text { fill: #38342D; }
      }
    </style>
  </defs>
  
  <!-- Isometric Cube Icon -->
  <g transform="translate(4, 4)">
    <!-- Top Face -->
    <path d="M20 2 L37 11.5 L20 21 L3 11.5 Z" fill="#282936" stroke="#3E4052" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Left Face -->
    <path d="M3 11.5 L20 21 L20 38 L3 28.5 Z" fill="#1C1D26" stroke="#3E4052" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Right Face -->
    <path d="M20 21 L37 11.5 L37 28.5 L20 38 Z" fill="#14151D" stroke="#3E4052" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Connection Line with Gradient -->
    <line x1="9" y1="26" x2="28" y2="17" stroke="url(#cubeLineGrad)" stroke-width="2.2" stroke-linecap="round" />
    
    <!-- White Node (upper left) -->
    <circle cx="16" cy="10" r="2.2" fill="#FFFFFF" />
    
    <!-- Green Node (lower left) -->
    <circle cx="9" cy="26" r="2.8" fill="#00E599" />
    
    <!-- Purple Node (mid right) -->
    <circle cx="28" cy="17" r="2.8" fill="#818CF8" />
  </g>

  <!-- Typography -->
  <!-- "Stock" in White (or Dark Charcoal in Light Scheme) -->
  <text class="stock-text" x="54" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.3">Stock</text>
  
  <!-- "Sense" in Lavender Blue (or Indigo in Light Scheme) -->
  <text class="sense-text" x="114" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.3">Sense</text>

  <!-- "IMS" Badge -->
  <rect class="badge-bg" x="186" y="14" width="46" height="20" rx="4" stroke-width="1" />
  <text class="badge-text" x="209" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1" text-anchor="middle">IMS</text>
</svg>
